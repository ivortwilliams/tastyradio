name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tastyradio-web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built here rather than on the droplet: a 1 GB box has better things to do than compile
      # TypeScript and a native SQLite binding on every deploy.
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authorise against the droplet
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the compose files
        run: |
          scp -i ~/.ssh/id_ed25519 web/deploy/docker-compose.yml web/deploy/Caddyfile \
            root@${{ secrets.DROPLET_HOST }}:/opt/tastyradio/

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.DROPLET_HOST }} '
            set -e
            cd /opt/tastyradio
            docker compose pull
            docker compose up -d
            docker image prune -f
          '

      - name: Prove it came back
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 "https://${{ secrets.SITE_HOST }}/healthz" > /tmp/health; then
              cat /tmp/health
              exit 0
            fi
            sleep 5
          done
          echo "the site did not come back healthy"
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.DROPLET_HOST }} \
            'cd /opt/tastyradio && docker compose logs --tail 60'
          exit 1
