# DigitalOcean App Platform spec for theweddingseal.com.
#
# Deliberately its own app, sharing nothing with the tastyradio droplet. That droplet
# also serves radio.truthseekersbyo.com, and nothing here is allowed to disturb it.
#
# One service rather than a free static site because the RSVP has to be received by
# something. basic-xxs is the smallest instance App Platform sells, billed hourly, so a
# fortnight of prank costs roughly $2.50 and the app can be destroyed the day after.

name: theweddingseal
region: syd

services:
  - name: web
    git:
      repo_clone_url: https://github.com/ivortwilliams/tastyradio.git
      branch: claude/wedding-prank-email-da9gf7
    source_dir: wedding
    environment_slug: node-js
    run_command: node server.js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
    envs:
      - key: NOTIFY_EMAIL
        scope: RUN_TIME
        value: ivortawilliams@gmail.com
      - key: NOTIFY_FROM
        scope: RUN_TIME
        value: The Wedding Seal <rsvp@theweddingseal.com>
      # RESEND_API_KEY and ADMIN_TOKEN are SECRET and set on the app, not written here.

domains:
  - domain: theweddingseal.com
    type: PRIMARY
  - domain: www.theweddingseal.com
    type: ALIAS
